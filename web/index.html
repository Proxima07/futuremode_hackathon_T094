<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>SnapFit</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="app">
  <!-- playsinline 一定要有，否則 iOS 會強制全螢幕播放 -->
  <video id="camera" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>

  <div class="topbar">
    <div id="intentPicker" class="chip"></div>
    <div id="cameraPicker" class="chip hidden"></div>
  </div>
  <div id="layoutBadge" class="badge"></div>

  <div id="zoomControl" class="zoom-control hidden"
       role="group" aria-label="相機縮放">
    <button id="zoomOut" type="button" aria-label="縮小">−</button>
    <input id="zoomRange" type="range" min="1" max="1" step="0.1"
           value="1" aria-label="相機縮放倍率">
    <button id="zoomIn" type="button" aria-label="放大">＋</button>
    <span id="zoomValue" aria-live="polite">1.0×</span>
  </div>

  <div id="analysisStatus" aria-live="off">等待相機啟動</div>
  <div id="lightBar" class="hidden"></div>
  <div id="hint" role="status" aria-live="polite"></div>

  <div id="compositionStatus" role="status" data-phase="searching">選擇構圖中</div>
  <button id="shutter" disabled aria-label="拍照"></button>
  <button id="reanalyzeBtn" type="button" disabled>重新分析</button>
  <pre id="debug" class="hidden"></pre>

  <!-- 啟動畫面。iOS 需要使用者主動點擊才能開相機 -->
  <div id="startScreen">
    <div class="intro">
      <h1>SnapFit</h1>
      <p>別的 App 教你怎麼拍<br>我們告訴你東西該怎麼擺</p>
      <p class="modes">🍜 美食　📦 二手商品　✨ 商品情境　🧍 環境人像</p>
    </div>
    <button id="startBtn">開始拍攝</button>
    <div id="errorBox" class="hidden"></div>
    <a class="devlink" href="/layouts-preview.html">版型預覽</a>
  </div>
</div>

<!-- 本機優先，抓不到再退回 CDN。執行 scripts/fetch_vendor.py 建立本機副本 -->
<script src="/js/vendor/tf.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js'"></script>
<script src="/js/vendor/coco-ssd.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'"></script>

<script type="module" src="/js/main.js"></script>
</body>
</html>
